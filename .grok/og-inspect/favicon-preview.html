<!doctype html>
<meta charset="utf-8">
<style>
  html,body{margin:0;background:#888;padding:16px}
  .row{display:flex;gap:16px;align-items:end;font:12px sans-serif;color:#fff}
  .cell{text-align:center}
  img{image-rendering:pixelated;background:#fff;display:block}
  .s16 img{width:16px;height:16px}
  .s32 img{width:32px;height:32px}
  .s64 img{width:64px;height:64px}
</style>
<div class="row">
  <div class="cell s16"><img src="/favicon.svg"><div>16</div></div>
  <div class="cell s32"><img src="/favicon.svg"><div>32</div></div>
  <div class="cell s64"><img src="/favicon.svg"><div>64</div></div>
</div>
